name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: |
          docker compose config
          docker compose -f deploy/docker-compose.prod.yml config
      - name: Build image
        run: docker build -t nomnom-bot:ci .

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:16-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run migrations on empty DB
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python scripts/migrate_db.py

  deterministic-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run deterministic retrieval metric tests
        run: python -m pytest tests/test_retrieval_metrics.py -q

  rag-quality-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_eval_dataset.py --dataset evaluation/data/release_qa.v1.jsonl
      - run: python -m pytest tests/evaluation tests/rag tests/knowledge tests/admin -q

  rag-release-eval:
    if: ${{ vars.RUN_RAG_RELEASE_EVAL == 'true' }}
    runs-on: [self-hosted, rag-eval]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: python scripts/validate_eval_dataset.py --dataset evaluation/data/release_qa.v1.jsonl --require-release-quota
      - run: python scripts/run_release_eval.py --dataset evaluation/data/release_qa.v1.jsonl --split holdout --repeat 3 --output-dir evaluation/reports/holdout
