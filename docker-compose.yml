version: "3.8"

services:
  # ---- PostgreSQL + pgvector (RAG storage) ----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nomnom-postgres
    environment:
      POSTGRES_USER: nomnom
      POSTGRES_PASSWORD: nomnom
      POSTGRES_DB: nomnom_rag
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomnom -d nomnom_rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bot-network

  # ---- NomNom Discord Bot ----
  chatgpt-discord-bot:
    build: 
      context: .
      dockerfile: Dockerfile
    image: nomnom-discord-bot:latest
    container_name: nomnom-discord-bot
    env_file:
      - .env
    environment:
      # Override POSTGRES_URL to use Docker service name
      POSTGRES_URL: postgresql://nomnom:nomnom@postgres:5432/nomnom_rag
      # Override OLLAMA_BASE_URL so the container can reach Ollama on the host machine
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    networks:
      - bot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


networks:
  bot-network:
    driver: bridge