services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nomnom-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: nomnom-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  vllm-embeddings:
    image: ${VLLM_EMBEDDING_IMAGE:-vllm/vllm-openai:latest}
    container_name: nomnom-vllm-embeddings
    ipc: host
    gpus: all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - --model
      - ${EMBEDDING_MODEL:-BAAI/bge-m3}
      - --hf-overrides
      - '{"architectures":["BgeM3EmbeddingModel"]}'
      - --convert
      - embed
      - --pooler-config
      - '{"task":"embed"}'
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.70}
    ports:
      - "${VLLM_EMBEDDING_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: always

  nomnom-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nomnom-bot:prod
    container_name: nomnom-api
    env_file:
      - ../.env
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vllm-embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  nomnom-bot:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nomnom-bot:prod
    container_name: nomnom-bot
    env_file:
      - ../.env
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "main.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vllm-embeddings:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  redis_data:
  huggingface_cache:
